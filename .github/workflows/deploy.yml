# Push to main, and the VPS is running the new code a couple of minutes later.
#
# The images are built HERE, on GitHub's runners, and the server only pulls
# them. That is not a stylistic choice: the VPS has one vCPU, `next build` is
# the heaviest thing this repository does, and building on the box would make
# every deploy a period of the site being slow — or an out-of-memory kill.
# GitHub's runners are free and have four cores.
#
#   push → test → build both images → push to GHCR → ssh in → pull → up
#
# Nothing here can deploy code that failed its tests: the deploy job needs the
# test job, and `needs` is a hard dependency.

name: Deploy to VPS

on:
  push:
    branches: [main]
  # So a deploy can be re-run by hand after fixing something on the server,
  # without an empty commit.
  workflow_dispatch:

concurrency:
  # Two deploys overlapping on one small server is how a half-updated stack
  # happens. A newer push cancels an older run that has not finished.
  group: deploy-vps
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Written out rather than built from ${{ github.repository_owner }}, which
  # gives `RaselMridha792` — and a registry name must be lowercase, so the tag
  # is rejected outright.
  #
  # These two strings must match the defaults in deploy/docker-compose.yml
  # exactly. If they drift, CI pushes under one name and the server pulls
  # another: both jobs go green and the old code keeps running, which is a far
  # worse failure than the one above.
  IMAGE_API: ghcr.io/raselmridha792/sfm-api
  IMAGE_WEB: ghcr.io/raselmridha792/sfm-web

jobs:
  # --------------------------------------------------------------------------
  # Everything that can be checked without a server.
  # --------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    env:
      # next.config.ts refuses to load without this once NODE_ENV is production,
      # which is deliberate — it is what stops a placeholder API_URL reaching a
      # deployment. `next typegen` loads the config too, so the guard fires here
      # as well.
      #
      # A developer never sees it, because apps/web/.env.local supplies the
      # value and that file is git-ignored. CI is the first place the repository
      # is ever seen without it, which is exactly why the value belongs here in
      # the open rather than in a file nobody checks in.
      #
      # The value is irrelevant to typechecking — only that the rewrite has
      # somewhere to point. The real one is baked into the image at build time.
      API_URL: http://localhost:4001/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The API and the web app both import @finance/shared, so it has to be
      # compiled before anything can typecheck against it.
      - run: npm run build:shared

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  # --------------------------------------------------------------------------
  # Build once, deploy the exact bytes that were built.
  # --------------------------------------------------------------------------
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/api.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_API }}:latest
            ${{ env.IMAGE_API }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the web app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web.Dockerfile
          push: true
          build-args: |
            API_URL=http://api:4001/api
            NEXT_PUBLIC_API_URL=${{ vars.API_ORIGIN }}/api
          tags: |
            ${{ env.IMAGE_WEB }}:latest
            ${{ env.IMAGE_WEB }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --------------------------------------------------------------------------
  # Tell the server to fetch what was just built.
  # --------------------------------------------------------------------------
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # A pull of two images on a small box is not instant.
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd /opt/sfm

            # The compose file, nginx config and Dockerfiles live in git; only
            # .env does not. Pulling keeps the server's copy honest.
            git fetch --quiet origin main
            git reset --hard --quiet origin/main

            cd deploy

            # Fetch the images this run just built, then swap. `up -d` without
            # --build is what keeps the server from ever compiling anything.
            docker compose pull --quiet api web
            docker compose up -d --remove-orphans

            # Images pile up fast on 50 GB. Keep the current ones, drop the
            # rest — dangling only, so a tagged rollback target survives.
            docker image prune -f

            docker compose ps
