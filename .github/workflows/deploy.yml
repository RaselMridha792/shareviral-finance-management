# Push to main, and the VPS is running the new code a couple of minutes later.
#
# The images are built HERE, on GitHub's runners, and the server only pulls
# them. That is not a stylistic choice: the VPS has one vCPU, `next build` is
# the heaviest thing this repository does, and building on the box would make
# every deploy a period of the site being slow — or an out-of-memory kill.
# GitHub's runners are free and have four cores.
#
#   push → test → build both images → push to GHCR → ssh in → pull → up
#
# Nothing here can deploy code that failed its tests: the deploy job needs the
# test job, and `needs` is a hard dependency.

name: Deploy to VPS

on:
  push:
    branches: [main]
  # So a deploy can be re-run by hand after fixing something on the server,
  # without an empty commit.
  workflow_dispatch:

concurrency:
  # Two deploys overlapping on one small server is how a half-updated stack
  # happens. A newer push cancels an older run that has not finished.
  group: deploy-vps
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Written out rather than built from ${{ github.repository_owner }}, which
  # gives `RaselMridha792` — and a registry name must be lowercase, so the tag
  # is rejected outright.
  #
  # These two strings must match the defaults in deploy/docker-compose.yml
  # exactly. If they drift, CI pushes under one name and the server pulls
  # another: both jobs go green and the old code keeps running, which is a far
  # worse failure than the one above.
  IMAGE_API: ghcr.io/raselmridha792/sfm-api
  IMAGE_WEB: ghcr.io/raselmridha792/sfm-web

jobs:
  # --------------------------------------------------------------------------
  # Everything that can be checked without a server.
  # --------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    env:
      # next.config.ts refuses to load without this once NODE_ENV is production,
      # which is deliberate — it is what stops a placeholder API_URL reaching a
      # deployment. `next typegen` loads the config too, so the guard fires here
      # as well.
      #
      # A developer never sees it, because apps/web/.env.local supplies the
      # value and that file is git-ignored. CI is the first place the repository
      # is ever seen without it, which is exactly why the value belongs here in
      # the open rather than in a file nobody checks in.
      #
      # The value is irrelevant to typechecking — only that the rewrite has
      # somewhere to point. The real one is baked into the image at build time.
      API_URL: http://localhost:4001/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The API and the web app both import @finance/shared, so it has to be
      # compiled before anything can typecheck against it.
      - run: npm run build:shared

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  # --------------------------------------------------------------------------
  # Build once, deploy the exact bytes that were built.
  # --------------------------------------------------------------------------
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/api.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_API }}:latest
            ${{ env.IMAGE_API }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the web app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web.Dockerfile
          push: true
          build-args: |
            API_URL=http://api:4001/api
            NEXT_PUBLIC_API_URL=${{ vars.API_ORIGIN }}/api
          tags: |
            ${{ env.IMAGE_WEB }}:latest
            ${{ env.IMAGE_WEB }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --------------------------------------------------------------------------
  # Tell the server to fetch what was just built.
  # --------------------------------------------------------------------------
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The server pulls the images, and a private repository's packages are
      # private too.
      packages: read
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Forwarded into the shell on the server, not written to a file.
          envs: GHCR_USER,GHCR_TOKEN
          # A pull of two images on a small box is not instant.
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd /opt/sfm

            # Signing in for the length of this pull, rather than leaving a
            # token on the server. GITHUB_TOKEN dies when this job ends, so
            # even a copy of it is worthless a minute from now — which is not
            # true of a personal access token, and the reason not to use one.
            # Three attempts, because one is not enough.
            #
            # GHCR answered `denied: denied` to a login that had worked on
            # every deploy before it and worked again on a re-run a minute
            # later, with nothing about the credentials changed in between. A
            # deploy that fails on somebody else's momentary refusal, and has
            # to be re-run by hand, teaches people that a red run means
            # nothing — which is expensive on the run where it means something.
            for attempt in 1 2 3; do
              if echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin; then
                break
              fi
              if [ "$attempt" = "3" ]; then
                echo "Could not sign in to ghcr.io after three attempts." >&2
                exit 1
              fi
              echo "ghcr.io login failed, attempt ${attempt}. Retrying." >&2
              sleep $((attempt * 5))
            done
            # Signed out even if the deploy fails below.
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

            # The compose file, nginx config and Dockerfiles live in git; only
            # .env does not. Pulling keeps the server's copy honest.
            git fetch --quiet origin main
            git reset --hard --quiet origin/main

            cd deploy

            # Fetch the images this run just built, then swap. `up -d` without
            # --build is what keeps the server from ever compiling anything.
            docker compose pull --quiet api web
            docker compose up -d --remove-orphans

            # nginx's configuration is a bind-mounted file. Changing it in git
            # changes it on disk and nothing else: the container's definition
            # is identical, so `up -d` leaves it running with the config it
            # read when it started, and an edit to sfm.conf silently never
            # takes effect.
            #
            # Tested first, reloaded second, and in that order on purpose. If
            # the new file is bad, `nginx -t` fails, `set -e` stops the deploy,
            # and the old configuration keeps serving the site — which is a far
            # better outcome than a reload that takes nginx down.
            docker compose exec -T nginx nginx -t
            docker compose exec -T nginx nginx -s reload

            # Images pile up fast on 50 GB. Keep the current ones, drop the
            # rest — dangling only, so a tagged rollback target survives.
            docker image prune -f

            docker compose ps
