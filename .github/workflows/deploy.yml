# Push to main, and the VPS is running the new code a couple of minutes later.
#
# The images are built HERE, on GitHub's runners, and the server only pulls
# them. That is not a stylistic choice: the VPS has one vCPU, `next build` is
# the heaviest thing this repository does, and building on the box would make
# every deploy a period of the site being slow — or an out-of-memory kill.
# GitHub's runners are free and have four cores.
#
#   push → test → build both images → push to GHCR → ssh in → pull → up
#
# Nothing here can deploy code that failed its tests: the deploy job needs the
# test job, and `needs` is a hard dependency.

name: Deploy to VPS

on:
  push:
    branches: [main]
  # So a deploy can be re-run by hand after fixing something on the server,
  # without an empty commit.
  workflow_dispatch:

concurrency:
  # Two deploys overlapping on one small server is how a half-updated stack
  # happens. A newer push cancels an older run that has not finished.
  group: deploy-vps
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Written out rather than built from ${{ github.repository_owner }}, which
  # gives `RaselMridha792` — and a registry name must be lowercase, so the tag
  # is rejected outright.
  #
  # These two strings must match the defaults in deploy/docker-compose.yml
  # exactly. If they drift, CI pushes under one name and the server pulls
  # another: both jobs go green and the old code keeps running, which is a far
  # worse failure than the one above.
  IMAGE_API: ghcr.io/raselmridha792/sfm-api
  IMAGE_WEB: ghcr.io/raselmridha792/sfm-web

jobs:
  # --------------------------------------------------------------------------
  # Everything that can be checked without a server.
  # --------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    env:
      # next.config.ts refuses to load without this once NODE_ENV is production,
      # which is deliberate — it is what stops a placeholder API_URL reaching a
      # deployment. `next typegen` loads the config too, so the guard fires here
      # as well.
      #
      # A developer never sees it, because apps/web/.env.local supplies the
      # value and that file is git-ignored. CI is the first place the repository
      # is ever seen without it, which is exactly why the value belongs here in
      # the open rather than in a file nobody checks in.
      #
      # The value is irrelevant to typechecking — only that the rewrite has
      # somewhere to point. The real one is baked into the image at build time.
      API_URL: http://localhost:4001/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The API and the web app both import @finance/shared, so it has to be
      # compiled before anything can typecheck against it.
      - run: npm run build:shared

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # The nginx config, checked here rather than on the server.
      #
      # It used to be impossible for a bad one to matter: the config was
      # bind-mounted as a single file, git replaced the inode on every deploy,
      # and the container went on reading whatever it booted with. Fixing that
      # mount made the config live — and the very next deploy shipped a
      # `keepalive_timeout` that the nginx image already sets in the same http
      # block. `[emerg] directive is duplicate`, nginx refused to start,
      # `restart: unless-stopped` put it in a crash loop, and the whole site was
      # down until a human pushed a fix.
      #
      # The same nginx image the server runs, given the same file. Thirty
      # seconds here against minutes of downtime there, and it fails the run
      # before anything is built or pushed.
      #
      # The certificates and the htpasswd only exist on the VPS, so they are
      # faked just well enough for the parser: `nginx -t` opens the certificate
      # files and reads the config, it does not verify a chain of trust.
      - name: The nginx config must be one nginx will actually start on
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          mkdir -p "$work/certs/live/app.hellonizam.com" "$work/secrets" "$work/certbot"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=app.hellonizam.com" \
            -keyout "$work/certs/live/app.hellonizam.com/privkey.pem" \
            -out    "$work/certs/live/app.hellonizam.com/fullchain.pem" 2>/dev/null
          : > "$work/secrets/db.htpasswd"

          docker run --rm \
            -v "$PWD/deploy/nginx/conf.d:/etc/nginx/conf.d:ro" \
            -v "$work/certs:/etc/letsencrypt:ro" \
            -v "$work/secrets:/etc/nginx/secrets:ro" \
            -v "$work/certbot:/var/www/certbot:ro" \
            nginx:1.27-alpine nginx -t

  # --------------------------------------------------------------------------
  # Build once, deploy the exact bytes that were built.
  # --------------------------------------------------------------------------
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/api.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_API }}:latest
            ${{ env.IMAGE_API }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the web app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web.Dockerfile
          push: true
          build-args: |
            API_URL=http://api:4001/api
            NEXT_PUBLIC_API_URL=${{ vars.API_ORIGIN }}/api
          tags: |
            ${{ env.IMAGE_WEB }}:latest
            ${{ env.IMAGE_WEB }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --------------------------------------------------------------------------
  # Tell the server to fetch what was just built.
  # --------------------------------------------------------------------------
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The server pulls the images, and a private repository's packages are
      # private too.
      packages: read
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Forwarded into the shell on the server, not written to a file.
          envs: GHCR_USER,GHCR_TOKEN
          # A pull of two images on a small box is not instant.
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd /opt/sfm

            # Signing in for the length of this pull, rather than leaving a
            # token on the server. GITHUB_TOKEN dies when this job ends, so
            # even a copy of it is worthless a minute from now — which is not
            # true of a personal access token, and the reason not to use one.
            # Three attempts, because one is not enough.
            #
            # GHCR answered `denied: denied` to a login that had worked on
            # every deploy before it and worked again on a re-run a minute
            # later, with nothing about the credentials changed in between. A
            # deploy that fails on somebody else's momentary refusal, and has
            # to be re-run by hand, teaches people that a red run means
            # nothing — which is expensive on the run where it means something.
            for attempt in 1 2 3; do
              if echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin; then
                break
              fi
              if [ "$attempt" = "3" ]; then
                echo "Could not sign in to ghcr.io after three attempts." >&2
                exit 1
              fi
              echo "ghcr.io login failed, attempt ${attempt}. Retrying." >&2
              sleep $((attempt * 5))
            done
            # Signed out even if the deploy fails below.
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

            # The compose file, nginx config and Dockerfiles live in git; only
            # .env does not. Pulling keeps the server's copy honest.
            git fetch --quiet origin main
            git reset --hard --quiet origin/main

            cd deploy

            # Fetch the images this run just built, then swap. `up -d` without
            # --build is what keeps the server from ever compiling anything.
            docker compose pull --quiet api web
            docker compose up -d --remove-orphans

            # Wait until nginx can actually be entered before entering it.
            #
            # `up -d` returns when Docker reports the container Started, which
            # is not the same as ready to exec into. When the container has just
            # been *recreated* — which is what happens the first time a volume
            # definition changes — the old one is still being torn down, and an
            # exec issued in that window resolves to a process that is already
            # gone:
            #
            #   OCI runtime exec failed: unable to create new parent process:
            #   namespace path: lstat /proc/571318/ns/ipc: no such file
            #
            # That killed the deploy that was fixing the mount, one line after
            # the fix worked. Polling with a trivial command separates "the
            # container is not up yet", which is worth waiting for, from "the
            # configuration is bad", which is worth failing on — and those two
            # must not be retried the same way.
            for attempt in $(seq 1 20); do
              if docker compose exec -T nginx true >/dev/null 2>&1; then
                break
              fi
              if [ "$attempt" = "20" ]; then
                echo "nginx never became ready to accept a command." >&2
                docker compose logs --tail 40 nginx >&2 || true
                exit 1
              fi
              sleep 2
            done

            # nginx's configuration comes from a bind-mounted DIRECTORY, and
            # `up -d` does not restart nginx when only the config changed — so
            # it has to be told to re-read.
            #
            # Tested first, reloaded second, and in that order on purpose. If
            # the new file is bad, `nginx -t` fails, `set -e` stops the deploy,
            # and the old configuration keeps serving the site — which is a far
            # better outcome than a reload that takes nginx down.
            docker compose exec -T nginx nginx -t
            docker compose exec -T nginx nginx -s reload

            # And then prove it, because "nginx -t passed" proved nothing.
            #
            # The config used to be bind-mounted as a single FILE. `git reset
            # --hard` replaces a file rather than editing it, which makes a new
            # inode, and a single-file bind mount follows the inode — so the
            # container kept reading the config it booted with. `nginx -t`
            # validated that stale file and passed. The reload reloaded it and
            # succeeded. The deploy went green. Rate limits added on 18 Aug did
            # nothing whatsoever for an hour, and every signal said fine.
            #
            # `nginx -T` dumps the configuration nginx is ACTUALLY running, so
            # comparing a marker from the repo against that dump is the one
            # check that would have caught it. A silent no-op deploy is worse
            # than a failed one: a red run gets fixed, a green one gets trusted.
            marker=$(grep -o 'zone=sfm_login[^ ;]*' nginx/conf.d/sfm.conf | head -1)
            if [ -z "$marker" ]; then
              echo "Could not find the marker in the repo's nginx config." >&2
              exit 1
            fi
            if ! docker compose exec -T nginx nginx -T 2>/dev/null | grep -q "$marker"; then
              echo "nginx is NOT running the config that is in git." >&2
              echo "Looked for '${marker}' in the live configuration and did not find it." >&2
              exit 1
            fi
            echo "nginx is running the config from git (found ${marker})."

            # Images pile up fast on 50 GB. Keep the current ones, drop the
            # rest — dangling only, so a tagged rollback target survives.
            docker image prune -f

            docker compose ps
