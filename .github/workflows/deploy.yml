# Push to main, and the VPS is running the new code a couple of minutes later.
#
# The images are built HERE, on GitHub's runners, and the server only pulls
# them. That is not a stylistic choice: the VPS has one vCPU, `next build` is
# the heaviest thing this repository does, and building on the box would make
# every deploy a period of the site being slow — or an out-of-memory kill.
# GitHub's runners are free and have four cores.
#
#   push → test → build both images → push to GHCR → ssh in → pull → up
#
# Nothing here can deploy code that failed its tests: the deploy job needs the
# test job, and `needs` is a hard dependency.

name: Deploy to VPS

on:
  push:
    branches: [main]
  # So a deploy can be re-run by hand after fixing something on the server,
  # without an empty commit.
  workflow_dispatch:

concurrency:
  # Two deploys overlapping on one small server is how a half-updated stack
  # happens. A newer push cancels an older run that has not finished.
  group: deploy-vps
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Written out rather than built from ${{ github.repository_owner }}, which
  # gives `RaselMridha792` — and a registry name must be lowercase, so the tag
  # is rejected outright.
  #
  # These two strings must match the defaults in deploy/docker-compose.yml
  # exactly. If they drift, CI pushes under one name and the server pulls
  # another: both jobs go green and the old code keeps running, which is a far
  # worse failure than the one above.
  IMAGE_API: ghcr.io/raselmridha792/sfm-api
  IMAGE_WEB: ghcr.io/raselmridha792/sfm-web

jobs:
  # --------------------------------------------------------------------------
  # Everything that can be checked without a server.
  # --------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    env:
      # next.config.ts refuses to load without this once NODE_ENV is production,
      # which is deliberate — it is what stops a placeholder API_URL reaching a
      # deployment. `next typegen` loads the config too, so the guard fires here
      # as well.
      #
      # A developer never sees it, because apps/web/.env.local supplies the
      # value and that file is git-ignored. CI is the first place the repository
      # is ever seen without it, which is exactly why the value belongs here in
      # the open rather than in a file nobody checks in.
      #
      # The value is irrelevant to typechecking — only that the rewrite has
      # somewhere to point. The real one is baked into the image at build time.
      API_URL: http://localhost:4001/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The API and the web app both import @finance/shared, so it has to be
      # compiled before anything can typecheck against it.
      - run: npm run build:shared

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # The nginx config, checked here rather than on the server.
      #
      # It used to be impossible for a bad one to matter: the config was
      # bind-mounted as a single file, git replaced the inode on every deploy,
      # and the container went on reading whatever it booted with. Fixing that
      # mount made the config live — and the very next deploy shipped a
      # `keepalive_timeout` that the nginx image already sets in the same http
      # block. `[emerg] directive is duplicate`, nginx refused to start,
      # `restart: unless-stopped` put it in a crash loop, and the whole site was
      # down until a human pushed a fix.
      #
      # The same nginx image the server runs, given the same file. Thirty
      # seconds here against minutes of downtime there, and it fails the run
      # before anything is built or pushed.
      #
      # The certificates and the htpasswd only exist on the VPS, so they are
      # faked just well enough for the parser: `nginx -t` opens the certificate
      # files and reads the config, it does not verify a chain of trust.
      - name: The nginx config must be one nginx will actually start on
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          mkdir -p "$work/certs/live/app.hellonizam.com" "$work/secrets" "$work/certbot"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=app.hellonizam.com" \
            -keyout "$work/certs/live/app.hellonizam.com/privkey.pem" \
            -out    "$work/certs/live/app.hellonizam.com/fullchain.pem" 2>/dev/null
          : > "$work/secrets/db.htpasswd"

          docker run --rm \
            -v "$PWD/deploy/nginx/conf.d:/etc/nginx/conf.d:ro" \
            -v "$work/certs:/etc/letsencrypt:ro" \
            -v "$work/secrets:/etc/nginx/secrets:ro" \
            -v "$work/certbot:/var/www/certbot:ro" \
            nginx:1.27-alpine nginx -t

  # --------------------------------------------------------------------------
  # Build once, deploy the exact bytes that were built.
  # --------------------------------------------------------------------------
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/api.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_API }}:latest
            ${{ env.IMAGE_API }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the web app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web.Dockerfile
          push: true
          build-args: |
            API_URL=http://api:4001/api
            NEXT_PUBLIC_API_URL=${{ vars.API_ORIGIN }}/api
          tags: |
            ${{ env.IMAGE_WEB }}:latest
            ${{ env.IMAGE_WEB }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --------------------------------------------------------------------------
  # Tell the server to fetch what was just built.
  # --------------------------------------------------------------------------
  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      # Pull first, then run the version that was pulled. The pull is not
      # inside remote-deploy.sh on purpose: `git reset --hard` replaces that
      # very file, and bash reads a script as it goes, so a script that
      # replaces itself mid-run executes half of one version and half of
      # another. Recovery by hand is these same three lines.
      REMOTE: |
        set -euo pipefail
        cd /opt/sfm
        git fetch --quiet origin main
        git reset --hard --quiet origin/main
        bash deploy/remote-deploy.sh
    permissions:
      contents: read
      # The server pulls the images, and a private repository's packages are
      # private too.
      packages: read
    steps:
      # Does the box answer at all?
      #
      # Purely diagnostic, and it never fails the run — but when a deploy dies
      # with `dial tcp ***:22: i/o timeout` the first question is always whether
      # the server was reachable at that minute or whether SSH itself was the
      # problem, and the log has never been able to answer it. Now it can.
      - name: Is the server answering on port 22
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            if timeout 10 bash -c "cat < /dev/null > /dev/tcp/${{ secrets.VPS_HOST }}/22" 2>/dev/null; then
              echo "probe $i: port 22 answered"
              exit 0
            fi
            echo "probe $i: no answer"
            sleep 10
          done
          echo "port 22 did not answer in three probes over 30s"

      # Three attempts, and — the part that was missing — a wait between them.
      #
      # There were two before, back to back. Run #107 failed both inside about
      # three minutes, which is the same minute as far as a box under load is
      # concerned: retrying immediately after a timeout asks the same question
      # of the same overloaded machine and gets the same answer. A minute, then
      # two, gives whatever was churning a chance to finish.
      - name: Deploy over SSH
        id: attempt1
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          timeout: 90s
          command_timeout: 15m
          script: ${{ env.REMOTE }}

      - name: Wait a minute
        if: steps.attempt1.outcome == 'failure'
        run: sleep 60

      - name: Deploy over SSH — second attempt
        id: attempt2
        if: steps.attempt1.outcome == 'failure'
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          timeout: 90s
          command_timeout: 15m
          script: ${{ env.REMOTE }}

      - name: Wait two minutes
        if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure'
        run: sleep 120

      # No `continue-on-error`: if this one fails, the run is red.
      - name: Deploy over SSH — third attempt
        if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure'
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          timeout: 90s
          command_timeout: 15m
          script: ${{ env.REMOTE }}

      # The deploy script exiting 0 means the commands ran. It does not mean the
      # site came back up — a container that starts and then crash-loops leaves
      # `docker compose up -d` perfectly happy and the site down, which is how
      # this repository once spent an evening green and broken.
      #
      # `/api/health` is `@Public()` and says nothing but "the process is up",
      # which is exactly what is being asked here.
      - name: The site has to answer before this run goes green
        run: |
          set -uo pipefail
          origin="${{ vars.API_ORIGIN }}"
          if [ -z "$origin" ]; then
            echo "API_ORIGIN is not set, so there is nothing to check."
            exit 1
          fi

          for i in $(seq 1 12); do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}'               --max-time 10 "$origin/api/health" || echo 000)
            if [ "$code" = "200" ] && grep -q '"status":"ok"' /tmp/health.json; then
              echo "healthy after $i check(s):"
              cat /tmp/health.json
              exit 0
            fi
            echo "check $i: HTTP $code"
            sleep 10
          done

          echo
          echo "The deploy ran, but $origin/api/health never came back ok."
          echo "main is now ahead of what is actually serving."
          cat /tmp/health.json 2>/dev/null || true
          exit 1
