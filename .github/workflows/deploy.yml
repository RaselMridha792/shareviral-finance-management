# Push to main, and the VPS is running the new code a couple of minutes later.
#
# The images are built HERE, on GitHub's runners, and the server only pulls
# them. That is not a stylistic choice: the VPS has one vCPU, `next build` is
# the heaviest thing this repository does, and building on the box would make
# every deploy a period of the site being slow — or an out-of-memory kill.
# GitHub's runners are free and have four cores.
#
#   push → test → build both images → push to GHCR → ssh in → pull → up
#
# Nothing here can deploy code that failed its tests: the deploy job needs the
# test job, and `needs` is a hard dependency.

name: Deploy to VPS

on:
  push:
    branches: [main]
  # So a deploy can be re-run by hand after fixing something on the server,
  # without an empty commit.
  workflow_dispatch:

concurrency:
  # Two deploys overlapping on one small server is how a half-updated stack
  # happens. A newer push cancels an older run that has not finished.
  group: deploy-vps
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Written out rather than built from ${{ github.repository_owner }}, which
  # gives `RaselMridha792` — and a registry name must be lowercase, so the tag
  # is rejected outright.
  #
  # These two strings must match the defaults in deploy/docker-compose.yml
  # exactly. If they drift, CI pushes under one name and the server pulls
  # another: both jobs go green and the old code keeps running, which is a far
  # worse failure than the one above.
  IMAGE_API: ghcr.io/raselmridha792/sfm-api
  IMAGE_WEB: ghcr.io/raselmridha792/sfm-web

jobs:
  # --------------------------------------------------------------------------
  # Everything that can be checked without a server.
  # --------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    env:
      # next.config.ts refuses to load without this once NODE_ENV is production,
      # which is deliberate — it is what stops a placeholder API_URL reaching a
      # deployment. `next typegen` loads the config too, so the guard fires here
      # as well.
      #
      # A developer never sees it, because apps/web/.env.local supplies the
      # value and that file is git-ignored. CI is the first place the repository
      # is ever seen without it, which is exactly why the value belongs here in
      # the open rather than in a file nobody checks in.
      #
      # The value is irrelevant to typechecking — only that the rewrite has
      # somewhere to point. The real one is baked into the image at build time.
      API_URL: http://localhost:4001/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The API and the web app both import @finance/shared, so it has to be
      # compiled before anything can typecheck against it.
      - run: npm run build:shared

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # The nginx config, checked here rather than on the server.
      #
      # It used to be impossible for a bad one to matter: the config was
      # bind-mounted as a single file, git replaced the inode on every deploy,
      # and the container went on reading whatever it booted with. Fixing that
      # mount made the config live — and the very next deploy shipped a
      # `keepalive_timeout` that the nginx image already sets in the same http
      # block. `[emerg] directive is duplicate`, nginx refused to start,
      # `restart: unless-stopped` put it in a crash loop, and the whole site was
      # down until a human pushed a fix.
      #
      # The same nginx image the server runs, given the same file. Thirty
      # seconds here against minutes of downtime there, and it fails the run
      # before anything is built or pushed.
      #
      # The certificates and the htpasswd only exist on the VPS, so they are
      # faked just well enough for the parser: `nginx -t` opens the certificate
      # files and reads the config, it does not verify a chain of trust.
      - name: The nginx config must be one nginx will actually start on
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          mkdir -p "$work/certs/live/app.hellonizam.com" "$work/secrets" "$work/certbot"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=app.hellonizam.com" \
            -keyout "$work/certs/live/app.hellonizam.com/privkey.pem" \
            -out    "$work/certs/live/app.hellonizam.com/fullchain.pem" 2>/dev/null
          : > "$work/secrets/db.htpasswd"

          docker run --rm \
            -v "$PWD/deploy/nginx/conf.d:/etc/nginx/conf.d:ro" \
            -v "$work/certs:/etc/letsencrypt:ro" \
            -v "$work/secrets:/etc/nginx/secrets:ro" \
            -v "$work/certbot:/var/www/certbot:ro" \
            nginx:1.27-alpine nginx -t

  # --------------------------------------------------------------------------
  # Build once, deploy the exact bytes that were built.
  # --------------------------------------------------------------------------
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/api.Dockerfile
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_API }}:latest
            ${{ env.IMAGE_API }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the web app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web.Dockerfile
          push: true
          build-args: |
            API_URL=http://api:4001/api
            NEXT_PUBLIC_API_URL=${{ vars.API_ORIGIN }}/api
          tags: |
            ${{ env.IMAGE_WEB }}:latest
            ${{ env.IMAGE_WEB }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --------------------------------------------------------------------------
  # Wait for the server to pick it up.
  # --------------------------------------------------------------------------
  # Nothing here reaches into the VPS, and that is the change. This pipeline
  # spent four evenings failing on `dial tcp ***:22: i/o timeout`, and adding
  # retries with backoff did not help: whatever refuses GitHub's runner refuses
  # it for minutes at a time, so all three attempts land inside the same
  # refusal. A deploy that depends on an inbound connection depends on
  # something nobody in this repository controls.
  #
  # So the server pulls instead. `deploy/watch-and-deploy.sh` runs there every
  # minute, notices main has moved, waits until the image tagged with that
  # exact commit exists, and deploys it. This job's only job is to say whether
  # that happened.
  verify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # `/api/health` reports the commit its image was built from, so this asks
      # the live site "which version are you?" and waits for the answer to be
      # this one. That is a stronger claim than the old SSH step ever made:
      # `docker compose up -d` exits 0 for a container that starts and then
      # crash-loops, which is how this stack once spent an evening green and
      # down.
      - name: The live site has to be running this commit
        run: |
          # `set +e`, deliberately. GitHub runs `run:` under `bash -e` by
          # default, and the first thing this loop does is grep a field the
          # currently-deployed build does not have — so grep exits 1, and with
          # `-e` the whole job dies before it has waited a single second. That
          # is exactly what happened on the run that introduced this file: it
          # failed in four seconds having never polled at all.
          set +e
          set -uo pipefail
          origin="${{ vars.API_ORIGIN }}"
          want="${{ github.sha }}"

          if [ -z "$origin" ]; then
            echo "API_ORIGIN is not set, so there is nothing to check."
            exit 1
          fi

          echo "Waiting for $origin to report ${want:0:7}."
          echo "The server checks for a new release every minute, so this"
          echo "normally answers within two."

          # Twenty minutes. The watcher fires every minute and a deploy takes
          # several, and a VPS that has been asleep needs its first tick.
          for i in $(seq 1 80); do
            # `grep -o` rather than a sed backreference: this string travels
            # through YAML and a shell before anything runs it, and a backslash
            # that survives one of those and not the other becomes a control
            # character in the file rather than an escape.
            got=$(curl -sS --max-time 10 "$origin/api/health" 2>/dev/null |
              grep -o '"version":"[^"]*"' | cut -d'"' -f4)

            if [ "$got" = "$want" ]; then
              echo "Live on ${want:0:7} after $((i * 15))s."
              exit 0
            fi

            if [ $((i % 8)) -eq 0 ]; then
              echo "  ${i}: still on ${got:-<no answer>}"
            fi

            sleep 15
          done

          echo
          echo "$origin never came up on ${want:0:7}."
          echo "main is ahead of what is serving. On the VPS:"
          echo "  systemctl status sfm-deploy.timer"
          echo "  journalctl -u sfm-deploy.service -n 50"
          echo "  tail -50 /opt/sfm/deploy/deploy.log"
          exit 1
