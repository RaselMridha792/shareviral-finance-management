# Two hostnames, one application.
#
#   app.hellonizam.com   the Next.js app — what people open
#   api.hellonizam.com   the NestJS API — what the browser calls for data
#
# They are different origins, so CORS applies and the API must name the app's
# origin in CORS_ORIGINS. They are the same *site*, though — SameSite is judged
# on the registrable domain, not the origin — so the auth cookies stay
# `SameSite=Lax` and are still sent between them. Nothing here needs
# `SameSite=None`, and reaching for it would weaken the app for no gain.
#
# What actually makes this work is COOKIE_DOMAIN=.hellonizam.com on the API.
# app.hellonizam.com server-renders every page and needs the session cookie to
# do it, and a host-only cookie written by api.hellonizam.com never reaches it:
# sign-in would succeed and every page would still say signed out.
#
# Certificates come from Let's Encrypt. The ACME location on port 80 is what
# lets certbot renew them without taking the site down.

# --------------------------------------------------------------------------
# Port 80 — ACME, and a push to HTTPS for everything else.
# --------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name app.hellonizam.com api.hellonizam.com;

    # certbot writes its challenge here and Let's Encrypt reads it over plain
    # HTTP. This must stay reachable, including at renewal time.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --------------------------------------------------------------------------
# The app.
# --------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.hellonizam.com;

    ssl_certificate     /etc/letsencrypt/live/app.hellonizam.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.hellonizam.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Payslips and bank statements are not somebody else's frame material.
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Only honest once the certificate is real, which it now is.
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 25m;

    # Kept as a fallback, not as the main path. The browser is built to call
    # api.hellonizam.com directly, but anything still asking this origin for
    # /api reaches Next's own rewrite and works rather than 404ing.
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# --------------------------------------------------------------------------
# The API.
# --------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.hellonizam.com;

    ssl_certificate     /etc/letsencrypt/live/api.hellonizam.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.hellonizam.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # An Excel export of a full year is not small, and neither is an import.
    client_max_body_size 25m;

    location / {
        proxy_pass http://api:4001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The API trusts exactly one hop and reads the client from here.
        # Without it every audit row records nginx's address, not the person's.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS — including the preflight — is answered by Nest itself, which
        # knows the allowed origin and sets `credentials: true`. So OPTIONS is
        # passed straight through and nginx adds no CORS headers of its own:
        # two sets of them is the same as none, because a browser rejects a
        # duplicated Access-Control-Allow-Origin.

        # Generating a year's spreadsheet takes longer than the default 60s.
        proxy_read_timeout 300s;
    }
}
