# Two hostnames, one application.
#
#   app.hellonizam.com   the Next.js app — what people open
#   api.hellonizam.com   the NestJS API — what the browser calls for data
#
# They are different origins, so CORS applies and the API must name the app's
# origin in CORS_ORIGINS. They are the same *site*, though — SameSite is judged
# on the registrable domain, not the origin — so the auth cookies stay
# `SameSite=Lax` and are still sent between them. Nothing here needs
# `SameSite=None`, and reaching for it would weaken the app for no gain.
#
# What actually makes this work is COOKIE_DOMAIN=.hellonizam.com on the API.
# app.hellonizam.com server-renders every page and needs the session cookie to
# do it, and a host-only cookie written by api.hellonizam.com never reaches it:
# sign-in would succeed and every page would still say signed out.
#
# Certificates come from Let's Encrypt. The ACME location on port 80 is what
# lets certbot renew them without taking the site down.

# --------------------------------------------------------------------------
# Port 80 — ACME, and a push to HTTPS for everything else.
# --------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name app.hellonizam.com api.hellonizam.com db.hellonizam.com;

    # certbot writes its challenge here and Let's Encrypt reads it over plain
    # HTTP. This must stay reachable, including at renewal time.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --------------------------------------------------------------------------
# The app.
# --------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.hellonizam.com;

    ssl_certificate     /etc/letsencrypt/live/app.hellonizam.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.hellonizam.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Payslips and bank statements are not somebody else's frame material.
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Only honest once the certificate is real, which it now is.
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 25m;

    resolver 127.0.0.11 valid=10s;

    # Kept as a fallback, not as the main path. The browser is built to call
    # api.hellonizam.com directly, but anything still asking this origin for
    # /api reaches Next's own rewrite and works rather than 404ing.
    location / {
        # Through a variable, so the name is looked up per request.
        #
        # With a literal, nginx resolves it once while loading the config and
        # then talks to that address for the life of the process. A deploy
        # replaces the web and api containers and they come back on new
        # addresses; nginx's own definition did not change, so it is not
        # recreated, and it keeps calling an address where nothing is
        # listening. The result is 502 on a site whose containers all report
        # healthy — which is exactly how this presented on 2026-08-16.
        #
        # Docker usually hands back the same address, which is why this hid for
        # as long as it did.
        set $web_upstream http://web:3000;
        proxy_pass $web_upstream$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# --------------------------------------------------------------------------
# The API.
# --------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.hellonizam.com;

    # The same certificate as the app block, and not a mistake.
    #
    # `certbot -d app... -d api...` issues ONE certificate covering both names
    # and files it under the first one. There is no live/api.hellonizam.com
    # directory to point at, and nginx refuses to start on a missing
    # certificate file — so this would have crash-looped on the first deploy.
    #
    # One certificate for both hostnames is also the better arrangement: one
    # thing to renew, and one thing that can expire.
    ssl_certificate     /etc/letsencrypt/live/app.hellonizam.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.hellonizam.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # An Excel export of a full year is not small, and neither is an import.
    # Uploads land here too: the largest a single file may be is 15 MB, and the
    # difference is headroom for the multipart envelope around it.
    client_max_body_size 25m;

    resolver 127.0.0.11 valid=10s;

    location / {
        # A variable, for the reason set out in the app block above: a literal
        # name is resolved once at config load, and a deploy moves this
        # container to a new address without nginx ever noticing.
        set $api_upstream http://api:4001;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The API trusts exactly one hop and reads the client from here.
        # Without it every audit row records nginx's address, not the person's.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS — including the preflight — is answered by Nest itself, which
        # knows the allowed origin and sets `credentials: true`. So OPTIONS is
        # passed straight through and nginx adds no CORS headers of its own:
        # two sets of them is the same as none, because a browser rejects a
        # duplicated Access-Control-Allow-Origin.

        # Generating a year's spreadsheet takes longer than the default 60s.
        proxy_read_timeout 300s;
    }
}

# --------------------------------------------------------------------------
# The database window.
# --------------------------------------------------------------------------
# Adminer, for looking at the tables the way Supabase's dashboard did. Three
# things stand between it and the open internet, and it is worth being explicit
# about which each one is for:
#
#   1. This nginx basic-auth prompt, before a byte reaches Adminer at all.
#   2. Adminer's own login, which is Postgres's — and the role it takes holds
#      SELECT and nothing else, so the audit trail cannot be walked around.
#   3. Postgres itself is never published to the host; only this network sees
#      5432.
#
# One caveat to know rather than discover. COOKIE_DOMAIN is .hellonizam.com, so
# the session cookie is sent to this hostname too. It is httpOnly, and the API
# refuses any request that does not carry the app's own header from the app's
# own origin, so a page served here cannot turn that cookie into API calls. But
# it is the reason not to put anything else under this domain casually.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name db.hellonizam.com;

    # The same certificate as the other two — see the note in the API block.
    # `certbot --expand` adds this name to it.
    ssl_certificate     /etc/letsencrypt/live/app.hellonizam.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.hellonizam.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    auth_basic           "SFM database";
    auth_basic_user_file /etc/nginx/secrets/db.htpasswd;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Every salary in the company is behind this. It has no business in a
    # search index or a web archive.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Enough for a schema export, nowhere near enough to be interesting.
    client_max_body_size 8m;

    # Docker's embedded DNS, needed because the upstream below is a variable.
    resolver 127.0.0.11 valid=30s;

    location / {
        # Through a variable on purpose.
        #
        # With a literal name, nginx resolves the upstream while *loading* the
        # config and refuses to start if it does not exist — so the day this
        # container is stopped, or the profile is left off a `compose up`,
        # nginx dies and takes app. and api. with it. A variable defers the
        # lookup to the request: a stopped viewer becomes a 502 on this
        # hostname and nothing else moves.
        set $adminer_upstream http://adminer:8080;
        proxy_pass $adminer_upstream$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A wide SELECT over the audit log is not a fast page.
        proxy_read_timeout 120s;
    }
}
