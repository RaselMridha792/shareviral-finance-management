# One origin. `/` is the Next.js app, `/api` is the NestJS API, and the browser
# cannot tell them apart — which is what lets both auth cookies stay
# sameSite=lax instead of being loosened to work across two hostnames.
#
# Written so a real certificate is a drop-in: replace the two ssl_certificate
# lines and reload. Nothing in the application changes.

server {
    listen 80;
    server_name _;

    # ACME first, if a domain ever arrives — this block is what lets certbot
    # work later without editing anything else.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Self-signed, because there is no domain to certify. Traffic is encrypted;
    # the browser will warn once because nothing vouches for the certificate.
    #   openssl req -x509 -nodes -days 825 -newkey rsa:2048 \
    #     -keyout deploy/nginx/certs/sfm.key \
    #     -out    deploy/nginx/certs/sfm.crt \
    #     -subj "/CN=$(curl -s ifconfig.me)"
    ssl_certificate     /etc/nginx/certs/sfm.crt;
    ssl_certificate_key /etc/nginx/certs/sfm.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Payslips and bank statements are not somebody else's frame material.
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # An Excel export of a full year is not small, and neither is an import.
    client_max_body_size 25m;

    # Deliberately before the `/` block: nginx matches the longest prefix, so
    # ordering does not decide it, but reading order should still make the
    # split obvious.
    location /api/ {
        proxy_pass http://api:4001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The API trusts exactly one hop and reads the client from here. Without
        # it every audit row records nginx's address instead of the person's.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generating a year's spreadsheet takes longer than the default 60s.
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js dev-style streaming and HMR both want these; harmless in
        # production and one less thing to remember if this file is reused.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
