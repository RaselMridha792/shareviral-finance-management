# Two hostnames, one application.
#
#   app.hellonizam.com   the Next.js app — what people open
#   api.hellonizam.com   the NestJS API — what the browser calls for data
#
# They are different origins, so CORS applies and the API must name the app's
# origin in CORS_ORIGINS. They are the same *site*, though — SameSite is judged
# on the registrable domain, not the origin — so the auth cookies stay
# `SameSite=Lax` and are still sent between them. Nothing here needs
# `SameSite=None`, and reaching for it would weaken the app for no gain.
#
# What actually makes this work is COOKIE_DOMAIN=.hellonizam.com on the API.
# app.hellonizam.com server-renders every page and needs the session cookie to
# do it, and a host-only cookie written by api.hellonizam.com never reaches it:
# sign-in would succeed and every page would still say signed out.
#
# Certificates come from Let's Encrypt. The ACME location on port 80 is what
# lets certbot renew them without taking the site down.

# --------------------------------------------------------------------------
# Rate limiting.
# --------------------------------------------------------------------------
# Two different attacks, guarded here rather than in the application, because
# this is the only door: `api` and `web` are `expose`d on the compose network
# and never published to the host, so every request from outside arrives
# through this process. A limit here cannot be walked around, and — the part
# that matters for staying up — traffic it rejects never reaches Node at all.
# An application-level limit still costs a request handler, a database pool
# slot and the memory behind them, which is exactly what runs out first.
#
# Keyed on $binary_remote_addr, the client's own address, which is correct
# because nothing sits in front of this server. If a CDN or proxy is ever put
# in front, this key becomes *its* address and one zone would then throttle
# everybody at once — that is the day to add real_ip_header and set_real_ip_from
# rather than the day to raise the numbers.
#
# The rates are deliberately generous. This is an internal portal for a few
# dozen people, and the failure that matters is not "an attacker got through
# slowly", it is "the finance team could not open a page during month-end
# close". A limit tight enough to inconvenience a real person is a limit that
# gets removed.
limit_req_zone  $binary_remote_addr zone=sfm_app:10m   rate=30r/s;
limit_req_zone  $binary_remote_addr zone=sfm_api:10m   rate=20r/s;

# A CORS preflight is not a sign-in attempt, and counting it as one cost every
# real sign-in six seconds.
#
# The browser sends OPTIONS before the POST because the app and the API are on
# different hostnames. Both land on the exact-match location below, so a single
# sign-in spent two tokens out of ten a minute — and since the preflight went
# first, it took the available token and left the POST to wait for the next
# one. Measured on the live site: preflight 0.34s, then 5.97s, then 5.97s. The
# delay was not occasional, it was every sign-in, and it looked exactly like a
# slow server.
#
# An empty key disables the limit for that request, which is nginx's own idiom
# for "not this one". Safe because a preflight carries no credentials and gets
# no answer worth having: it cannot guess a password, and the POST behind it is
# still counted.
map $request_method $login_limit_key {
    OPTIONS "";
    default $binary_remote_addr;
}

# Sign-in is the one place where slow is the point. Twenty a minute per
# address, against a bcrypt hash at cost 12, a five-attempt lock on the account
# itself, and now a second factor. The account lock stops one account being
# guessed; this stops one password being tried against every account in turn,
# which the account lock cannot see.
#
# Ten was the first number and it was too tight for people rather than for
# attackers: five sign-ins a minute from an office where everybody shares one
# address is a normal Monday, and a limit that inconveniences the staff is a
# limit that gets switched off.
#
# NAMED sfm_signin, not sfm_login, and that rename is the load-bearing part.
#
# Changing this zone's key while keeping its name made nginx refuse the entire
# configuration on reload. A shared memory zone survives a reload - that is how
# the counters are not reset every time - and nginx will only reuse one whose
# key still matches. When it does not, it logs
#
#   limit_req_zone "sfm_login" uses the "$login_limit_key" key
#   while previously it used the "$binary_remote_addr" key
#
# and keeps the OLD configuration running. Nothing else fails: the site stays
# up, `nginx -t` passes because a fresh test process has no previous zone to
# clash with, and `nginx -s reload` returns without complaint because it only
# sends a signal. The deploy goes green and changes nothing.
#
# A new name is a new zone, with nothing to reconcile.
limit_req_zone  $login_limit_key zone=sfm_signin:10m rate=20r/m;

# Adminer gets its own, and used to share the sign-in zone.
#
# It is a whole web application: every page, stylesheet and script was spending
# a token from a budget of ten a minute meant for sign-ins. Opening the
# database viewer therefore made signing in slow, on a different hostname, for
# reasons nobody would ever connect. Same intent as before - it is behind basic
# auth, so this is not the lock, only what stops somebody grinding at it.
limit_req_zone  $binary_remote_addr zone=sfm_db:10m    rate=60r/m;

limit_conn_zone $binary_remote_addr zone=sfm_conn:10m;

# 429, not the default 503. A 503 says the server is broken; a 429 says the
# caller is going too fast. They are read differently by browsers, by uptime
# monitors, and by the person deciding whether to phone somebody at 2am.
limit_req_status  429;
limit_conn_status 429;

# Slowloris: a connection opened and then fed a header every few seconds ties
# up a worker slot indefinitely. These make an idle or dribbling client let go.
client_header_timeout 20s;
client_body_timeout   20s;
send_timeout          30s;
# No keepalive_timeout here. The nginx image's own /etc/nginx/nginx.conf
# already sets it in the same http block this file is included into, and a
# second one is not an override — it is `[emerg] directive is duplicate`, and
# nginx refuses to start at all. Its default of 65s is what we wanted anyway.

# Nginx's version number tells a scanner which CVEs to try, and helps nobody
# who is meant to be here.
server_tokens off;

# --------------------------------------------------------------------------
# Port 80 — ACME, and a push to HTTPS for everything else.
# --------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name app.hellonizam.com api.hellonizam.com db.hellonizam.com;

    # certbot writes its challenge here and Let's Encrypt reads it over plain
    # HTTP. This must stay reachable, including at renewal time.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --------------------------------------------------------------------------
# The app.
# --------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.hellonizam.com;

    ssl_certificate     /etc/letsencrypt/live/app.hellonizam.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.hellonizam.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Payslips and bank statements are not somebody else's frame material.
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Only honest once the certificate is real, which it now is.
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 25m;

    resolver 127.0.0.11 valid=10s;

    # A burst of 100, because one page load is not one request.
    #
    # Opening a screen fetches the document, then its JavaScript chunks, its
    # fonts and its RSC payloads — several dozen at once over HTTP/2, all from
    # the same address within a second. `burst` is what lets that through;
    # `rate` is what the same address settles down to afterwards. `nodelay`
    # serves the burst immediately rather than smoothing it out, because a
    # queued chunk is a page that renders in pieces.
    limit_req  zone=sfm_app burst=100 nodelay;
    limit_conn sfm_conn 40;

    # Kept as a fallback, not as the main path. The browser is built to call
    # api.hellonizam.com directly, but anything still asking this origin for
    # /api reaches Next's own rewrite and works rather than 404ing.
    location / {
        # Through a variable, so the name is looked up per request.
        #
        # With a literal, nginx resolves it once while loading the config and
        # then talks to that address for the life of the process. A deploy
        # replaces the web and api containers and they come back on new
        # addresses; nginx's own definition did not change, so it is not
        # recreated, and it keeps calling an address where nothing is
        # listening. The result is 502 on a site whose containers all report
        # healthy — which is exactly how this presented on 2026-08-16.
        #
        # Docker usually hands back the same address, which is why this hid for
        # as long as it did.
        set $web_upstream http://web:3000;
        proxy_pass $web_upstream$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# --------------------------------------------------------------------------
# The API.
# --------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.hellonizam.com;

    # The same certificate as the app block, and not a mistake.
    #
    # `certbot -d app... -d api...` issues ONE certificate covering both names
    # and files it under the first one. There is no live/api.hellonizam.com
    # directory to point at, and nginx refuses to start on a missing
    # certificate file — so this would have crash-looped on the first deploy.
    #
    # One certificate for both hostnames is also the better arrangement: one
    # thing to renew, and one thing that can expire.
    ssl_certificate     /etc/letsencrypt/live/app.hellonizam.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.hellonizam.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # An Excel export of a full year is not small, and neither is an import.
    # Uploads land here too: the largest a single file may be is 15 MB, and the
    # difference is headroom for the multipart envelope around it.
    client_max_body_size 25m;

    resolver 127.0.0.11 valid=10s;

    limit_conn sfm_conn 40;

    # Sign-in, and only sign-in.
    #
    # Declared before `location /` and as an exact match, so it wins outright.
    # `/auth/refresh` deliberately does not land here: a person with several
    # tabs open renews a token in each of them at once, and throttling that
    # would sign somebody out for having done nothing but leave a tab open.
    #
    # burst=5 with no nodelay: the sixth attempt inside a minute waits rather
    # than fails. Somebody mistyping their password sees the ordinary "email or
    # password is incorrect" — slightly slower — while a script trying
    # thousands is held at ten a minute. Failing them outright would tell the
    # script exactly where the limit is.
    location = /api/auth/login {
        limit_req zone=sfm_signin burst=10;

        set $api_upstream http://api:4001;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=sfm_api burst=40 nodelay;

        # A variable, for the reason set out in the app block above: a literal
        # name is resolved once at config load, and a deploy moves this
        # container to a new address without nginx ever noticing.
        set $api_upstream http://api:4001;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The API trusts exactly one hop and reads the client from here.
        # Without it every audit row records nginx's address, not the person's.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS — including the preflight — is answered by Nest itself, which
        # knows the allowed origin and sets `credentials: true`. So OPTIONS is
        # passed straight through and nginx adds no CORS headers of its own:
        # two sets of them is the same as none, because a browser rejects a
        # duplicated Access-Control-Allow-Origin.

        # Generating a year's spreadsheet takes longer than the default 60s.
        proxy_read_timeout 300s;
    }
}

# --------------------------------------------------------------------------
# The database window.
# --------------------------------------------------------------------------
# Adminer, for looking at the tables the way Supabase's dashboard did. Three
# things stand between it and the open internet, and it is worth being explicit
# about which each one is for:
#
#   1. This nginx basic-auth prompt, before a byte reaches Adminer at all.
#   2. Adminer's own login, which is Postgres's — and the role it takes holds
#      SELECT and nothing else, so the audit trail cannot be walked around.
#   3. Postgres itself is never published to the host; only this network sees
#      5432.
#
# One caveat to know rather than discover. COOKIE_DOMAIN is .hellonizam.com, so
# the session cookie is sent to this hostname too. It is httpOnly, and the API
# refuses any request that does not carry the app's own header from the app's
# own origin, so a page served here cannot turn that cookie into API calls. But
# it is the reason not to put anything else under this domain casually.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name db.hellonizam.com;

    # The same certificate as the other two — see the note in the API block.
    # `certbot --expand` adds this name to it.
    ssl_certificate     /etc/letsencrypt/live/app.hellonizam.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.hellonizam.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    auth_basic           "SFM database";
    auth_basic_user_file /etc/nginx/secrets/db.htpasswd;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Every salary in the company is behind this. It has no business in a
    # search index or a web archive.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Enough for a schema export, nowhere near enough to be interesting.
    client_max_body_size 8m;

    # Behind basic auth already, so this is not the lock — it is what stops
    # somebody grinding at the lock. A wrong password here costs a request
    # against this limit whether or not it ever reaches Adminer.
    limit_req  zone=sfm_db burst=40 nodelay;
    limit_conn sfm_conn 20;

    # Docker's embedded DNS, needed because the upstream below is a variable.
    resolver 127.0.0.11 valid=30s;

    location / {
        # Through a variable on purpose.
        #
        # With a literal name, nginx resolves the upstream while *loading* the
        # config and refuses to start if it does not exist — so the day this
        # container is stopped, or the profile is left off a `compose up`,
        # nginx dies and takes app. and api. with it. A variable defers the
        # lookup to the request: a stopped viewer becomes a 502 on this
        # hostname and nothing else moves.
        set $adminer_upstream http://adminer:8080;
        proxy_pass $adminer_upstream$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A wide SELECT over the audit log is not a fast page.
        proxy_read_timeout 120s;
    }
}
