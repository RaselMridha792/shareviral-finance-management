# The VPS deployment: one nginx in front, the two apps behind it, Postgres
# beside them. Same shape as the Vercel + Render setup — the browser sees one
# origin and `/api` is quietly forwarded — so moving here changes hostnames and
# nothing in the application.
#
#   cp .env.example .env      # fill it in, then:
#   docker compose up -d --build
#
# Secrets come from .env, which is git-ignored. Nothing here contains one.

name: sfm

services:
  # Postgres on this box — off unless you ask for it.
  #
  #   docker compose up -d                       the database is elsewhere
  #   docker compose --profile local-db up -d    run it here too
  #
  # A profile rather than a comment, because the choice has to be visible: the
  # api service reads DATABASE_URL and does not care which of the two answered.
  # Starting a Postgres nobody points at is how you end up backing up an empty
  # database for a month.
  db:
    profiles: ["local-db"]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Dhaka, so `date_trunc` and friends agree with the app's own idea of a
      # day. Every period boundary already goes through todayInDhaka(), but a
      # database that disagrees makes every hand-written query a trap.
      TZ: Asia/Dhaka
    volumes:
      - db-data:/var/lib/postgresql/data
      # Backups land on the host, not inside the container — a volume that dies
      # with the container is not a backup.
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published to the host. Only the API needs to reach it, and it does so
    # over the internal network.
    expose:
      - "5432"

  api:
    # Both an image and a build, on purpose.
    #
    # On the server: `docker compose pull` fetches what CI built and `up -d`
    # runs it, so a one-vCPU box never compiles anything. Locally, or if the
    # registry is ever unreachable, `up -d --build` still works from source.
    image: ${IMAGE_API:-ghcr.io/raselmridha792/sfm-api}:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4001
      # One setting decides where the data lives — a managed Postgres, or the
      # `db` service above. The API cannot tell the difference and should not
      # have to.
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_UNPOOLED: ${DATABASE_URL_UNPOOLED:-${DATABASE_URL}}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY}
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      # The app's origin, which is a different hostname from this API's. The
      # browser calls the API directly, so this is a real cross-origin setup
      # and Nest answers the preflight from this list.
      CORS_ORIGINS: ${WEB_ORIGIN}
      # Scopes the auth cookies to the parent domain so both hostnames receive
      # them. Without it the API's cookie is host-only, the web app never sees
      # it, and every server-rendered page reports signed out while sign-in
      # itself appears to succeed.
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      TZ: Asia/Dhaka
    expose:
      - "4001"

  web:
    image: ${IMAGE_WEB:-ghcr.io/raselmridha792/sfm-web}:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        # Two different answers to "where is the API", and both are correct.
        #
        # API_URL is how *this container* reaches it: over the internal network,
        # no DNS, no TLS, no round trip out to the internet and back.
        API_URL: http://api:4001/api
        # NEXT_PUBLIC_API_URL is where the *browser* sends its requests, so it
        # has to be a name the browser can resolve. Baked in at build time,
        # because Next inlines every NEXT_PUBLIC_* value into the bundle.
        NEXT_PUBLIC_API_URL: ${API_ORIGIN}/api
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      API_URL: http://api:4001/api
      NEXT_PUBLIC_API_URL: ${API_ORIGIN}/api
      TZ: Asia/Dhaka
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/sfm.conf:/etc/nginx/conf.d/default.conf:ro
      # Let's Encrypt writes here from the host; nginx only reads.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Where certbot puts its challenge file, and where the port-80 block
      # looks for it. Renewal fails silently without this and the certificate
      # simply expires one day, which is the worst way to find out.
      - ./certbot-www:/var/www/certbot

volumes:
  db-data:
