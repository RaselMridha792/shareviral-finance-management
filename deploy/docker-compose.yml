# The VPS deployment: one nginx in front, the two apps behind it, Postgres
# beside them. Same shape as the Vercel + Render setup — the browser sees one
# origin and `/api` is quietly forwarded — so moving here changes hostnames and
# nothing in the application.
#
#   cp .env.example .env      # fill it in, then:
#   docker compose up -d --build
#
# Secrets come from .env, which is git-ignored. Nothing here contains one.

name: sfm

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Dhaka, so `date_trunc` and friends agree with the app's own idea of a
      # day. Every period boundary already goes through todayInDhaka(), but a
      # database that disagrees makes every hand-written query a trap.
      TZ: Asia/Dhaka
    volumes:
      - db-data:/var/lib/postgresql/data
      # Backups land on the host, not inside the container — a volume that dies
      # with the container is not a backup.
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published to the host. Only the API needs to reach it, and it does so
    # over the internal network.
    expose:
      - "5432"

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4001
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATABASE_URL_UNPOOLED: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY}
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      CORS_ORIGINS: ${PUBLIC_ORIGIN}
      TZ: Asia/Dhaka
    expose:
      - "4001"

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        # Baked at build time: next.config.ts reads API_URL to build the
        # rewrite, and rewrites are decided when the app is built.
        API_URL: http://api:4001/api
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      API_URL: http://api:4001/api
      NEXT_PUBLIC_API_URL: /api
      TZ: Asia/Dhaka
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/sfm.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro

volumes:
  db-data:
